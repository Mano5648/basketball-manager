# Builds the iOS app on Codemagic's Macs and uploads it to TestFlight, so no
# local Mac is needed.
#
# One-time setup in Codemagic (Team settings):
#   - Integrations > Developer Portal: add the App Store Connect API key and
#     name it "Dublin Lions ASC" (matches `integrations` below).
#   - Environment variables: create the group "dublin_lions_web" with the same
#     VITE_* values as app/.env.local. They are baked into the web bundle.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Dublin Lions ASC
    environment:
      groups:
        - dublin_lions_web
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ie.dublinlions.app
      vars:
        APP_STORE_APPLE_ID: 0 # set to the app's Apple ID from App Store Connect
        XCODE_PROJECT: app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
    scripts:
      - name: Install web dependencies
        script: cd app && npm ci
      - name: Build web app and sync Capacitor
        script: cd app && npm run build && npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd app/ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
